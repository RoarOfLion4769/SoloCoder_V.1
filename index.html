<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1e1e2f, #302b63);
    }

    .calculator {
        width: 330px;
        padding: 20px;
        border-radius: 24px;
        background: #171722;
        box-shadow: 0 20px 50px rgba(0,0,0,.4);
    }

    .display {
        width: 100%;
        height: 90px;
        margin-bottom: 18px;
        padding: 15px;
        border: none;
        border-radius: 16px;
        background: #0d0d14;
        color: white;
        font-size: 36px;
        text-align: right;
        outline: none;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }

    button {
        height: 62px;
        border: none;
        border-radius: 16px;
        font-size: 21px;
        font-weight: bold;
        cursor: pointer;
        color: white;
        background: #292938;
        transition: .12s;
    }

    button:hover { background: #39394b; }
    button:active { transform: scale(.95); }

    .operator { background: #5757d9; }
    .operator:hover { background: #6969e8; }

    .action {
        background: #8b3d5c;
    }

    .equals {
        background: #19a974;
        grid-row: span 2;
        height: 136px;
    }

    .zero {
        grid-column: span 2;
    }
</style>
</head>
<body>

<div class="calculator">
    <input class="display" id="display" value="0" readonly>

    <div class="buttons">
        <button class="action" onclick="clearDisplay()">AC</button>
        <button class="action" onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="addOperator('%')">%</button>
        <button class="operator" onclick="addOperator('/')">÷</button>

        <button onclick="addNumber('7')">7</button>
        <button onclick="addNumber('8')">8</button>
        <button onclick="addNumber('9')">9</button>
        <button class="operator" onclick="addOperator('*')">×</button>

        <button onclick="addNumber('4')">4</button>
        <button onclick="addNumber('5')">5</button>
        <button onclick="addNumber('6')">6</button>
        <button class="operator" onclick="addOperator('-')">−</button>

        <button onclick="addNumber('1')">1</button>
        <button onclick="addNumber('2')">2</button>
        <button onclick="addNumber('3')">3</button>
        <button class="operator" onclick="addOperator('+')">+</button>

        <button class="zero" onclick="addNumber('0')">0</button>
        <button onclick="addNumber('.')">.</button>
        <button class="equals" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById("display");

    function addNumber(number) {
        if (display.value === "0" || display.value === "Error") {
            display.value = number === "." ? "0." : number;
        } else {
            display.value += number;
        }
    }

    function addOperator(operator) {
        if (display.value === "Error") return;
        const last = display.value.slice(-1);

        if ("+-*/%".includes(last)) {
            display.value = display.value.slice(0, -1) + operator;
        } else {
            display.value += operator;
        }
    }

    function clearDisplay() {
        display.value = "0";
    }

    function deleteLast() {
        if (display.value === "Error" || display.value.length === 1) {
            display.value = "0";
        } else {
            display.value = display.value.slice(0, -1);
        }
    }

    function calculate() {
        try {
            let expression = display.value;

            if (!/[0-9]$/.test(expression)) return;

            let result = Function('"use strict"; return (' + expression + ')')();

            if (!Number.isFinite(result)) {
                display.value = "Error";
                return;
            }

            display.value = Number.isInteger(result)
                ? result
                : parseFloat(result.toFixed(10));
        } catch {
            display.value = "Error";
        }
    }

    // Keyboard support
    document.addEventListener("keydown", (event) => {
        const key = event.key;

        if ("0123456789.".includes(key)) addNumber(key);
        else if ("+-*/%".includes(key)) addOperator(key);
        else if (key === "Enter" || key === "=") calculate();
        else if (key === "Escape") clearDisplay();
        else if (key === "Backspace") deleteLast();
    });
</script>

</body>
</html>
